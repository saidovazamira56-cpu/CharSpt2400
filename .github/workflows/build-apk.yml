name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug -Pandroid.builder.sdkDownload=true --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/ChatSptAi-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/app-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatSptAi-debug-apk
          path: release-assets/ChatSptAi-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: "ChatSptAi APK v${{ github.run_number }}"
          body: |
            ## 📱 Скачать ChatSptAi для Android

            Готовая сборка APK приложения **ChatSptAi** с поддержкой Firebase и Gemini API.

            ### ⬇️ Прямое скачивание на телефон:
            - **[Скачать ChatSptAi-debug.apk](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/ChatSptAi-debug.apk)**

            ---
            - **Номер сборки:** ${{ github.run_number }}
            - **Коммит:** `${{ github.sha }}`
            - **Ветка:** `${{ github.ref_name }}`

            #### 💡 Как установить на телефон:
            1. Нажмите на `ChatSptAi-debug.apk` ниже или по ссылке выше.
            2. Дождитесь загрузки и откройте файл на смартфоне.
            3. Если появится запрос, разрешите установку приложений из браузера или проводника.
          files: |
            release-assets/ChatSptAi-debug.apk
            release-assets/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
